# ============================================================
# Apache Virtual Host — GravPort Geoportal
# File: /etc/apache2/sites-available/geoportal.conf
# ============================================================

<VirtualHost *:80>
    ServerName 167.205.88.206
    ServerAlias www.167.205.88.206

    DocumentRoot /var/www/geoportal/public

    <Directory /var/www/geoportal/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log files
    ErrorLog  ${APACHE_LOG_DIR}/geoportal_error.log
    CustomLog ${APACHE_LOG_DIR}/geoportal_access.log combined

    # PHP settings
    php_value upload_max_filesize 256M
    php_value post_max_size 256M
    php_value memory_limit 256M
    php_value max_execution_time 300
</VirtualHost>
